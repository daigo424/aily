apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - aily-ml
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: vllm
      component: predictor
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
