apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aily-api
  namespace: aily
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aily-api
                port:
                  number: 80
