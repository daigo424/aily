apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: aily-api
  namespace: aily
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aily-api
  template:
    metadata:
      labels:
        app: aily-api
    spec:
      serviceAccountName: aily-api
      containers:
        - name: api
          image: REPLACE_WITH_ECR_AILY_API_URL
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aily-secret
          env:
            - name: PORT
              value: "8000"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlflow.svc.cluster.local:5000
            - name: REDIS_HOST
              value: redis-primary.redis.svc.cluster.local
            - name: LLM_BASE_URL
              value: http://vllm-predictor.aily-ml.svc.cluster.local/v1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
  strategy:
    blueGreen:
      activeService: aily-api
      previewService: aily-api-preview
      autoPromotionEnabled: false
