apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aily-ml
resources:
  - ../../../base/vllm
  - pv.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: vllm
        annotations:
          eks.amazonaws.com/role-arn: REPLACE_WITH_VLLM_IRSA_ARN
    target:
      kind: ServiceAccount
      name: vllm
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vllm
      spec:
        template:
          spec:
            containers:
              - name: vllm
                env:
                  - name: LLM_MODEL
                    value: REPLACE_WITH_LLM_MODEL
    target:
      kind: Deployment
      name: vllm
