apiVersion: v1
kind: PersistentVolume
metadata:
  name: vllm-model-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - allow-delete
    - region ap-northeast-1
  csi:
    driver: s3.csi.aws.com
    volumeHandle: REPLACE_WITH_ML_DATA_BUCKET
    volumeAttributes:
      bucketName: REPLACE_WITH_ML_DATA_BUCKET
      prefix: "models/"
