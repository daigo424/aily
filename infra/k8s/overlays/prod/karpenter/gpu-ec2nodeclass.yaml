apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: REPLACE_WITH_NODE_ROLE_NAME
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    karpenter.sh/discovery: REPLACE_WITH_CLUSTER_NAME
    role: llm
