apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        role: llm
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g6.xlarge      # 4vCPU 32GB 1xL4   24GB VRAM
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      taints:
        - key: nvidia.com/gpu
          value: "present"
          effect: NoSchedule
      expireAfter: 720h
  limits:
    cpu: "16"
    memory: 64Gi
    nvidia.com/gpu: "2"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
        schedule: "0 0 * * *"
        duration: 24h
      - nodes: "0"
        schedule: "0 0 * * *"
        duration: 12h
