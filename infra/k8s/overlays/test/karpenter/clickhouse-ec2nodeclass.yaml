apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: clickhouse
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: aily-test-eks-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: aily-test
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: aily-test
  tags:
    karpenter.sh/discovery: aily-test
    role: clickhouse
