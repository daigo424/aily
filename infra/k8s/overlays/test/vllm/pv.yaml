apiVersion: v1
kind: PersistentVolume
metadata:
  name: vllm-model-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - allow-delete
    - region us-west-2
  csi:
    driver: s3.csi.aws.com
    volumeHandle: aily-test-ml-data
    volumeAttributes:
      bucketName: aily-test-ml-data
      prefix: "models/"
