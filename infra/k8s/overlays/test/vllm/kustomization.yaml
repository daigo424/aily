apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aily-ml
resources:
  - ../../../base/vllm
  - pv.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: vllm
        annotations:
          eks.amazonaws.com/role-arn: REPLACE_WITH_VLLM_IRSA_ARN
    target:
      kind: ServiceAccount
      name: vllm
