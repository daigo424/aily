apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aily-ml
resources:
  - ../../../base/vllm
  - pv.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: vllm
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::815935788564:role/aily-test-vllm-role
    target:
      kind: ServiceAccount
      name: vllm
  - patch: |-
      apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      metadata:
        name: vllm
      spec:
        predictor:
          model:
            env:
              - name: LLM_MODEL
                value: google/gemma-3-12b-it-w8a8
    target:
      kind: InferenceService
      name: vllm
