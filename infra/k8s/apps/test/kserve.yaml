apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kserve.github.io/helm-charts/
    chart: kserve
    targetRevision: "0.14.0"
    helm:
      valuesObject:
        kserve:
          modelmesh:
            enabled: false
          controller:
            deploymentMode: RawDeployment
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
          localmodel:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
