apiVersion: v1
kind: Pod
metadata:
  name: db-init
  namespace: default
spec:
  restartPolicy: Never
  volumes:
    - name: scripts
      configMap:
        name: db-init-scripts
  containers:
    - name: db-init
      image: postgres:16-alpine
      command: [sh, -c]
      args:
        - |
          for f in $(ls /scripts/*.sql | sort); do
            echo "Running $f..."
            psql "postgresql://appuser@${RDS_HOST}:${RDS_PORT}/postgres" -f "$f" || exit 1
          done
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db-init-secret
              key: password
        - name: RDS_HOST
          value: "${RDS_HOST}"
        - name: RDS_PORT
          value: "${RDS_PORT}"
      volumeMounts:
        - name: scripts
          mountPath: /scripts
