name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [test, prod]
      compute_enabled:
        description: "EKS・NAT・IRSA を作成するか (false で削除。RDS・S3 は保持)"
        required: true
        type: boolean
        default: false

env:
  TF_WORKING_DIR: "infra/terraform"   # Change to e.g. "terraform" if .tf files are in a subdirectory
  ARGOCD_CHART_VERSION: "9.5.22"

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block prod deployment from non-main branch
        if: github.event.inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "prod deployment is only allowed from main branch (current: ${{ github.ref }})"
          exit 1

  apply:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve account ID
        id: account
        run: |
          case "${{ github.event.inputs.environment }}" in
            prod) echo "id=${{ vars.PROD_AWS_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
            test) echo "id=${{ vars.TEST_AWS_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/GitHubActionsWorkloadDeployRole
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend-config=backend.hcl \
            -backend-config="key=workloads/${{ vars.WORKLOAD_NAME }}/${{ github.event.inputs.environment }}/additional_github_repos/${{ github.repository }}/terraform.tfstate"

      - name: Drain resources before destroy
        id: pre-destroy
        if: github.event.inputs.compute_enabled == 'false'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")
          if [ -z "$CLUSTER_NAME" ]; then
            echo "No EKS cluster in state, skipping cleanup"
            echo "cluster_name=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "cluster_name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"

          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ap-northeast-1 || {
            echo "Could not connect to EKS cluster, skipping cleanup"
            exit 0
          }

          # PVC を先に削除して EBS CSI に AWS 側 volume の削除を依頼
          kubectl delete pvc --all --all-namespaces --ignore-not-found=true

          # pvc-protection finalizer は使用中 Pod がいると自動解除されない
          # destroy 目的なので全 PVC の finalizer を強制除去
          kubectl get pvc --all-namespaces -o json 2>/dev/null | \
            jq -r '.items[] | "\(.metadata.namespace) \(.metadata.name)"' | \
            while read -r ns name; do
              kubectl patch pvc "$name" -n "$ns" \
                -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true
            done

          kubectl wait pvc --for=delete --all --all-namespaces --timeout=3m 2>/dev/null || true

          # NodeClaim を削除してノードを解放
          kubectl delete nodeclaims --all --ignore-not-found=true
          kubectl wait --for=delete nodeclaims --all --timeout=5m || true

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_environment:             ${{ github.event.inputs.environment }}
          TF_VAR_compute_enabled:         ${{ github.event.inputs.compute_enabled }}
          TF_VAR_docker_hub_username:     ${{ secrets.DOCKER_HUB_USERNAME }}
          TF_VAR_docker_hub_access_token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: terraform apply -input=false -auto-approve

      - name: Verify no orphaned AWS resources after destroy
        if: github.event.inputs.compute_enabled == 'false' && steps.pre-destroy.outputs.cluster_name != ''
        env:
          CLUSTER_NAME: ${{ steps.pre-destroy.outputs.cluster_name }}
        run: |
          FAILED=false

          echo "=== Checking for orphaned EBS volumes ==="
          ORPHANED_VOLUMES=$(aws ec2 describe-volumes \
            --filters \
              "Name=tag:kubernetes.io/cluster/${CLUSTER_NAME},Values=owned" \
            --query "Volumes[*].{VolumeId:VolumeId,State:State,Size:Size,PVC:Tags[?Key=='kubernetes.io/created-for/pvc/name']|[0].Value,Namespace:Tags[?Key=='kubernetes.io/created-for/pvc/namespace']|[0].Value}" \
            --output table 2>/dev/null || echo "")
          if [ -n "$ORPHANED_VOLUMES" ]; then
            echo "::error::Orphaned EBS volumes detected:"
            echo "$ORPHANED_VOLUMES"
            FAILED=true
          else
            echo "No orphaned EBS volumes."
          fi

          echo "=== Checking for orphaned EC2 instances (Karpenter nodes) ==="
          ORPHANED_EC2=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:karpenter.sh/cluster-name,Values=${CLUSTER_NAME}" \
              "Name=instance-state-name,Values=running,pending,stopping,stopped" \
            --query "Reservations[*].Instances[*].{InstanceId:InstanceId,State:State.Name,Type:InstanceType,NodePool:Tags[?Key=='karpenter.sh/nodepool']|[0].Value}" \
            --output table 2>/dev/null || echo "")
          if [ -n "$ORPHANED_EC2" ]; then
            echo "::error::Orphaned EC2 instances detected (Karpenter nodes not terminated):"
            echo "$ORPHANED_EC2"
            FAILED=true
          else
            echo "No orphaned EC2 instances."
          fi

          echo "=== Checking for orphaned Load Balancers ==="
          ALL_LB_ARNS=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[*].LoadBalancerArn" --output text 2>/dev/null || echo "")
          ORPHANED_LBS=""
          for ARN in $ALL_LB_ARNS; do
            TAGS=$(aws elbv2 describe-tags --resource-arns "$ARN" \
              --query "TagDescriptions[0].Tags" --output json 2>/dev/null || echo "[]")
            if echo "$TAGS" | grep -q "kubernetes.io/cluster/${CLUSTER_NAME}"; then
              ORPHANED_LBS="${ORPHANED_LBS}\n  ${ARN}"
            fi
          done
          if [ -n "$ORPHANED_LBS" ]; then
            echo "::error::Orphaned Load Balancers detected:"
            printf "%b\n" "$ORPHANED_LBS"
            FAILED=true
          else
            echo "No orphaned Load Balancers."
          fi

          echo "=== Checking for orphaned Security Groups (AWS LBC) ==="
          ORPHANED_SGS=$(aws ec2 describe-security-groups \
            --filters "Name=tag:elbv2.k8s.aws/cluster,Values=${CLUSTER_NAME}" \
            --query "SecurityGroups[*].{GroupId:GroupId,GroupName:GroupName}" \
            --output table 2>/dev/null || echo "")
          if [ -n "$ORPHANED_SGS" ]; then
            echo "::error::Orphaned Security Groups (LBC) detected:"
            echo "$ORPHANED_SGS"
            FAILED=true
          else
            echo "No orphaned Security Groups."
          fi

          echo "=== Checking for orphaned Target Groups ==="
          ORPHANED_TGS=$(aws elbv2 describe-target-groups \
            --query "TargetGroups[?contains(TargetGroupName, '${CLUSTER_NAME}') == \`true\`].{ARN:TargetGroupArn,Name:TargetGroupName}" \
            --output table 2>/dev/null || echo "")
          if [ -n "$ORPHANED_TGS" ]; then
            echo "::warning::Orphaned Target Groups detected (minor cost impact):"
            echo "$ORPHANED_TGS"
          else
            echo "No orphaned Target Groups."
          fi

          if [ "$FAILED" = "true" ]; then
            echo "::error::Orphaned AWS resources remain after destroy. Manual cleanup required."
            exit 1
          fi
          echo "All clear — no orphaned resources found."

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Record compute state
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ENV="${{ github.event.inputs.environment }}"
          COMPUTE="${{ github.event.inputs.compute_enabled }}"
          VAR_NAME="COMPUTE_ENABLED_$(echo "$ENV" | tr '[:lower:]' '[:upper:]')"
          gh variable set "$VAR_NAME" --body "$COMPUTE"

      - name: Record bastion instance ID
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          ENV="${{ github.event.inputs.environment }}"
          INSTANCE_ID=$(terraform output -raw bastion_instance_id 2>/dev/null || echo "")
          [ -z "$INSTANCE_ID" ] && exit 0
          VAR_NAME="BASTION_INSTANCE_ID_$(echo "$ENV" | tr '[:lower:]' '[:upper:]')"
          gh variable set "$VAR_NAME" --body "$INSTANCE_ID"

      - name: Fill K8s placeholders from Terraform outputs
        if: github.event.inputs.compute_enabled == 'true'
        run: |
          ENV="${{ github.event.inputs.environment }}"
          AWS_ACCOUNT_ID="${{ steps.account.outputs.id }}"
          TF="$GITHUB_WORKSPACE/${{ env.TF_WORKING_DIR }}"
          CLUSTER_NAME=$(terraform -chdir="$TF" output -raw eks_cluster_name)
          VPC_ID=$(terraform -chdir="$TF" output -raw vpc_id)
          BUCKET=$(terraform -chdir="$TF" output -raw ml_data_bucket_name)
          LBC_ARN=$(terraform -chdir="$TF" output -raw lbc_role_arn)
          ARGO_ARN=$(terraform -chdir="$TF" output -raw ml_workflow_role_arn)
          ARGO_WORKFLOWS_SERVER_ARN=$(terraform -chdir="$TF" output -raw argo_workflows_server_role_arn)
          KARPENTER_ROLE_ARN=$(terraform -chdir="$TF" output -raw karpenter_role_arn)
          NODE_ROLE_NAME=$(terraform -chdir="$TF" output -raw node_role_name)
          AILY_API_ROLE_ARN=$(terraform -chdir="$TF" output -raw weather_api_role_arn)
          MLFLOW_ROLE_ARN=$(terraform -chdir="$TF" output -raw mlflow_role_arn)
          K8S="$GITHUB_WORKSPACE/infra/k8s"

          find "$K8S/apps/${ENV}" -name "*.yaml" -exec sed -i "s|REPLACE_WITH_AWS_ACCOUNT_ID|$AWS_ACCOUNT_ID|g" {} +
          find "$K8S/apps/${ENV}" -name "*.yaml" -exec sed -i "s|REPLACE_WITH_CLUSTER_NAME|$CLUSTER_NAME|g" {} +
          sed -i "s|REPLACE_WITH_VPC_ID|$VPC_ID|g"                     "$K8S/apps/${ENV}/aws-lbc.yaml"
          sed -i "s|REPLACE_WITH_LBC_IRSA_ARN|$LBC_ARN|g"             "$K8S/apps/${ENV}/aws-lbc.yaml"
          sed -i "s|REPLACE_WITH_ARGO_WORKFLOWS_SERVER_IRSA_ARN|$ARGO_WORKFLOWS_SERVER_ARN|g" "$K8S/apps/${ENV}/argo-workflows.yaml"
          sed -i "s|REPLACE_WITH_KARPENTER_ROLE_ARN|$KARPENTER_ROLE_ARN|g" "$K8S/apps/${ENV}/karpenter.yaml"
          sed -i "s|REPLACE_WITH_CLUSTER_NAME|$CLUSTER_NAME|g"         "$K8S/overlays/${ENV}/karpenter/ec2nodeclass.yaml"
          sed -i "s|REPLACE_WITH_NODE_ROLE_NAME|$NODE_ROLE_NAME|g"     "$K8S/overlays/${ENV}/karpenter/ec2nodeclass.yaml"
          sed -i "s|REPLACE_WITH_AILY_API_IRSA_ARN|$AILY_API_ROLE_ARN|g" "$K8S/overlays/${ENV}/aily-api/kustomization.yaml"
          sed -i "s|REPLACE_WITH_MLFLOW_IRSA_ARN|$MLFLOW_ROLE_ARN|g"    "$K8S/overlays/${ENV}/mlflow/kustomization.yaml"
          find "$K8S/overlays/${ENV}/karpenter" -name "gpu-ec2nodeclass.yaml" -o -name "clickhouse-ec2nodeclass.yaml" | \
            xargs -I{} sed -i \
              -e "s|REPLACE_WITH_NODE_ROLE_NAME|$NODE_ROLE_NAME|g" \
              -e "s|REPLACE_WITH_CLUSTER_NAME|$CLUSTER_NAME|g" {}
          VLLM_ROLE_ARN=$(terraform -chdir="$TF" output -raw vllm_role_arn)
          sed -i "s|REPLACE_WITH_VLLM_IRSA_ARN|$VLLM_ROLE_ARN|g" "$K8S/overlays/${ENV}/vllm/kustomization.yaml"
          find "$K8S/overlays/${ENV}/vllm" -name "pv.yaml" \
            -exec sed -i "s|REPLACE_WITH_ML_DATA_BUCKET|$BUCKET|g" {} +
          LLM_MODEL="${{ vars.LLM_MODEL }}"
          find "$K8S/overlays/${ENV}/vllm" -name "kustomization.yaml" \
            -exec sed -i "s|REPLACE_WITH_LLM_MODEL|$LLM_MODEL|g" {} +
          LANGFUSE_ROLE_ARN=$(terraform -chdir="$TF" output -raw langfuse_role_arn)
          sed -i "s|REPLACE_WITH_LANGFUSE_IRSA_ARN|$LANGFUSE_ROLE_ARN|g" "$K8S/apps/${ENV}/langfuse-app.yaml"
          LANGFUSE_NEXTAUTH_URL="${{ vars.LANGFUSE_NEXTAUTH_URL }}"
          sed -i "s|REPLACE_WITH_LANGFUSE_NEXTAUTH_URL|$LANGFUSE_NEXTAUTH_URL|g" "$K8S/apps/${ENV}/langfuse-app.yaml"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/
          git diff --staged --quiet && echo "No placeholder changes" && exit 0

          BASE_BRANCH="${{ github.ref_name }}"
          BRANCH="chore/fill-k8s-placeholders-${ENV}-${GITHUB_SHA}"
          git checkout -b "$BRANCH"
          git commit -m "chore(${ENV}): fill K8s placeholders from Terraform outputs"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null || \
            gh pr create \
              --title "chore(${ENV}): fill K8s placeholders from Terraform outputs" \
              --body "terraform-apply により自動生成（環境: ${ENV}）" \
              --base "$BASE_BRANCH" \
              --head "$BRANCH")
          git fetch origin "$BASE_BRANCH" --depth=1
          gh pr merge "$PR_URL" --squash --admin --delete-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create grafana-admin-secret
        if: github.event.inputs.compute_enabled == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ap-northeast-1

          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic grafana-admin-secret \
            --namespace monitoring \
            --from-literal=admin-user="admin" \
            --from-literal=admin-password="${GRAFANA_ADMIN_PASSWORD}" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secret
        if: github.event.inputs.compute_enabled == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GH_BOT_PAT: ${{ secrets.GH_BOT_PAT }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          LANGFUSE_NEXTAUTH_SECRET: ${{ secrets.LANGFUSE_NEXTAUTH_SECRET }}
          LANGFUSE_SALT: ${{ secrets.LANGFUSE_SALT }}
          LANGFUSE_NEXTAUTH_URL: ${{ vars.LANGFUSE_NEXTAUTH_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ap-northeast-1

          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          DB_HOST=$(echo "${RDS_ENDPOINT}" | cut -d: -f1)
          DB_NAME="mlflow"
          DB_USERNAME="appuser"
          DB_PORT=$(echo "${RDS_ENDPOINT}" | cut -d: -f2)
          DATABASE_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require"
          ARTIFACT_ROOT="s3://$(terraform output -raw ml_data_bucket_name)/mlflow-artifacts"

          kubectl create namespace aily --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic aily-secret \
            --namespace aily \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=ARTIFACT_ROOT="$ARTIFACT_ROOT" \
            --from-literal=DB_HOST="$DB_HOST" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=DB_PORT="$DB_PORT" \
            --from-literal=DB_SSLMODE="require" \
            --from-literal=APP_DB_NAME="app" \
            --from-literal=CP_CONVERSATION_DB_NAME="cp_conversation" \
            --from-literal=DB_DEV_HOST="$DB_HOST" \
            --from-literal=APP_ATLAS_DEV_DB_NAME="app_test" \
            --from-literal=LANGFUSE_PUBLIC_KEY="${LANGFUSE_PUBLIC_KEY}" \
            --from-literal=LANGFUSE_SECRET_KEY="${LANGFUSE_SECRET_KEY}" \
            --from-literal=LANGFUSE_HOST="http://langfuse-web.langfuse.svc.cluster.local:3000" \
            --from-literal=LLM_MODEL="${LLM_MODEL}" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

          # ClickHouse password (used by ClickHouseInstallation CR and Langfuse)
          kubectl create namespace clickhouse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic clickhouse-secret \
            --namespace clickhouse \
            --from-literal=password="${CLICKHOUSE_PASSWORD}" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

          # Langfuse connection secrets
          LANGFUSE_DB_URL="postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/langfuse?sslmode=require"
          CLICKHOUSE_HTTP_URL="http://chi-langfuse-langfuse-0-0.clickhouse.svc.cluster.local:8123"

          kubectl create namespace langfuse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic langfuse-secret \
            --namespace langfuse \
            --from-literal=DATABASE_URL="${LANGFUSE_DB_URL}" \
            --from-literal=NEXTAUTH_URL="${LANGFUSE_NEXTAUTH_URL:-http://localhost:13001}" \
            --from-literal=NEXTAUTH_SECRET="${LANGFUSE_NEXTAUTH_SECRET}" \
            --from-literal=SALT="${LANGFUSE_SALT}" \
            --from-literal=REDIS_CONNECTION_STRING="redis://redis-master.redis.svc.cluster.local:6379" \
            --from-literal=CLICKHOUSE_URL="${CLICKHOUSE_HTTP_URL}" \
            --from-literal=CLICKHOUSE_PASSWORD="${CLICKHOUSE_PASSWORD}" \
            --from-literal=S3_BUCKET="$(terraform output -raw ml_data_bucket_name)" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic aily-git-token \
            --namespace aily \
            --from-literal=token="${GH_BOT_PAT}" \
            --save-config \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Bootstrap ArgoCD root app
        if: github.event.inputs.compute_enabled == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ARGOCD_REPO_PASSWORD: ${{ secrets.GH_BOT_PAT }}
        run: |
          ENV="${{ github.event.inputs.environment }}"
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ap-northeast-1

          kubectl wait --for=condition=Ready nodes --all --timeout=10m

          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

          kubectl wait --for=condition=Available deployment/coredns -n kube-system --timeout=5m

          HELM_STATUS=$(helm status argocd -n argocd 2>/dev/null | grep "^STATUS:" | awk '{print $2}')
          if [ -n "$HELM_STATUS" ] && [ "$HELM_STATUS" != "deployed" ]; then
            echo "Cleaning up argocd release in state: $HELM_STATUS"
            helm uninstall argocd -n argocd || true
            sleep 10
          fi

          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --version "$ARGOCD_CHART_VERSION" \
            --set configs.params."server\.insecure"=true \
            --set global.tolerations[0].key=workload \
            --set global.tolerations[0].operator=Equal \
            --set-string global.tolerations[0].value=true \
            --set global.tolerations[0].effect=NoSchedule \
            --wait \
            --timeout 10m || {
            echo "=== ArgoCD pod status ==="
            kubectl get pods -n argocd -o wide || true
            echo "=== ArgoCD events ==="
            kubectl get events -n argocd --sort-by='.lastTimestamp' | tail -30 || true
            echo "=== Node resource usage ==="
            kubectl describe nodes | grep -A 10 "Allocated resources" || true
            exit 1
          }

          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: aily-repo
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          stringData:
            type: git
            url: https://github.com/daigo424/aily
            username: x-access-token
            password: "${ARGOCD_REPO_PASSWORD}"
          EOF

          sed "s|targetRevision: .*|targetRevision: ${{ github.ref_name }}|" \
            "$GITHUB_WORKSPACE/infra/k8s/bootstrap/root-app-${ENV}.yaml" | kubectl apply -f -

      - name: Create databases
        if: github.event.inputs.compute_enabled == 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          RDS_ENDPOINT=$(terraform output -raw rds_endpoint)
          RDS_HOST=$(echo "${RDS_ENDPOINT}" | cut -d: -f1)
          RDS_PORT=$(echo "${RDS_ENDPOINT}" | cut -d: -f2)

          kubectl create configmap db-init-scripts \
            --namespace default \
            --from-file="$GITHUB_WORKSPACE/infra/docker/db/init/" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic db-init-secret \
            --namespace default \
            --from-literal=password="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl delete pod db-init -n default --ignore-not-found=true

          RDS_HOST=$RDS_HOST RDS_PORT=$RDS_PORT \
            envsubst '${RDS_HOST} ${RDS_PORT}' \
            < "$GITHUB_WORKSPACE/.github/k8s/db-init.yaml" \
            | kubectl apply -f -

          kubectl wait pod/db-init \
            --for=jsonpath='{.status.phase}'=Succeeded \
            --timeout=120s || { kubectl logs db-init -n default; kubectl delete pod db-init -n default --ignore-not-found=true; exit 1; }
          kubectl delete pod db-init -n default --ignore-not-found=true
          kubectl delete configmap db-init-scripts -n default --ignore-not-found=true
          kubectl delete secret db-init-secret -n default --ignore-not-found=true
