name: destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (test only)"
        required: true
        type: choice
        options: [test]
      aws_region:
        description: "AWS region to destroy (e.g. ap-northeast-1, us-east-1)"
        required: true
        type: string
        default: "ap-northeast-1"

env:
  TF_WORKING_DIR: "infra/terraform"

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block non-main branch
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feature/bootstrap-vllm'
        run: |
          echo "destroy-tokyo is only allowed from main or feature branches"
          exit 1

  destroy:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve account ID
        id: account
        run: |
          case "${{ github.event.inputs.environment }}" in
            test) echo "id=${{ vars.TEST_AWS_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/GitHubActionsWorkloadDeployRole
          aws-region: ${{ github.event.inputs.aws_region }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -backend-config=backend.hcl \
            -backend-config="key=workloads/${{ vars.WORKLOAD_NAME }}/${{ github.event.inputs.environment }}/additional_github_repos/${{ github.repository }}/terraform.tfstate"

      - name: Drain EKS resources
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")
          if [ -z "$CLUSTER_NAME" ]; then
            echo "No EKS cluster in state, skipping drain"
            exit 0
          fi

          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ github.event.inputs.aws_region }}" || {
            echo "Could not connect to EKS cluster, skipping drain"
            exit 0
          }

          kubectl get pvc --all-namespaces -o json 2>/dev/null | \
            jq -r '.items[] | "\(.metadata.namespace) \(.metadata.name)"' | \
            while read -r ns name; do
              kubectl patch pvc "$name" -n "$ns" \
                -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true
            done
          kubectl delete pvc --all --all-namespaces --ignore-not-found=true --wait=false
          kubectl wait pvc --for=delete --all --all-namespaces --timeout=2m 2>/dev/null || true

          kubectl delete nodeclaims --all --ignore-not-found=true --wait=false
          kubectl wait --for=delete nodeclaims --all --timeout=5m || true

      - name: Cleanup K8s-created AWS resources
        run: |
          REGION="${{ github.event.inputs.aws_region }}"

          # ELBv2 (ALB/NLB) — kubernetes タグ付き
          LB_ARNS=$(aws elbv2 describe-load-balancers --region "$REGION" \
            --query "LoadBalancers[*].LoadBalancerArn" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          for ARN in $LB_ARNS; do
            TAGS=$(aws elbv2 describe-tags --resource-arns "$ARN" --region "$REGION" \
              --query "TagDescriptions[0].Tags" --output json 2>/dev/null || echo "[]")
            IS_K8S=$(echo "$TAGS" | jq '[.[] | select(.Key | startswith("kubernetes.io/") or startswith("elbv2.k8s.aws/"))] | length' 2>/dev/null || echo "0")
            if [ "$IS_K8S" -gt 0 ]; then
              echo "Deleting ELBv2: $ARN"
              aws elbv2 delete-load-balancer --load-balancer-arn "$ARN" --region "$REGION" || true
            fi
          done

          # Classic ELB — kubernetes タグ付き
          CLASSIC_NAMES=$(aws elb describe-load-balancers --region "$REGION" \
            --query "LoadBalancerDescriptions[*].LoadBalancerName" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          for NAME in $CLASSIC_NAMES; do
            TAGS=$(aws elb describe-tags --region "$REGION" --load-balancer-names "$NAME" \
              --query "TagDescriptions[0].Tags" --output json 2>/dev/null || echo "[]")
            IS_K8S=$(echo "$TAGS" | jq '[.[] | select(.Key | startswith("kubernetes.io/cluster/"))] | length' 2>/dev/null || echo "0")
            if [ "$IS_K8S" -gt 0 ]; then
              echo "Deleting Classic ELB: $NAME"
              aws elb delete-load-balancer --load-balancer-name "$NAME" --region "$REGION" || true
            fi
          done

          # LB 削除後 ENI が解放されるまで待機
          echo "Waiting 30s for ENIs to detach..."
          sleep 30

          # 残存 ENI (kubernetes 関連) を強制削除
          ENI_IDS=$(aws ec2 describe-network-interfaces --region "$REGION" \
            --filters "Name=status,Values=available" \
            --query "NetworkInterfaces[?contains(Description,'ELB') || contains(Description,'Amazon EKS') || contains(Description,'aws-K8S')].NetworkInterfaceId" \
            --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          for ENI in $ENI_IDS; do
            echo "Deleting ENI: $ENI"
            aws ec2 delete-network-interface --network-interface-id "$ENI" --region "$REGION" || true
          done

      - name: Terraform destroy (${{ github.event.inputs.aws_region }})
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_environment:             ${{ github.event.inputs.environment }}
          TF_VAR_compute_enabled:         "true"
          TF_VAR_docker_hub_username:     ${{ secrets.DOCKER_HUB_USERNAME }}
          TF_VAR_docker_hub_access_token: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var "aws_region=${{ github.event.inputs.aws_region }}"
