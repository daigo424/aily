name: Quantize and Upload Model to S3

# 前提条件:
#   Repository Variables:
#     AWS_REGION
#     TEST_AWS_ACCOUNT_ID
#     PROD_AWS_ACCOUNT_ID
#     WORKLOAD_NAME  (例: aily)
#   Repository Secrets:
#     HF_TOKEN
#
#   IAM ロール名は Terraform の name_prefix から自動構築されるため手動設定不要:
#     arn:aws:iam::{account_id}:role/{WORKLOAD_NAME}-{env}-quantize-gha-role

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '対象環境'
        required: true
        type: choice
        options: [test, prod]
        default: test
      hf_model_id:
        description: 'HuggingFace model ID'
        required: true
        default: 'google/gemma-3-12b-it'
      quantize:
        description: '量子化フォーマット'
        required: true
        type: choice
        options: [w8a8, int8, int4]
        default: 'w8a8'
      instance_type:
        description: 'EC2 instance type (GPU必須: g5.xlarge=A10G 24GB 16GB RAM / g6e.xlarge=L40S 48GB 32GB RAM)'
        required: true
        default: 'g6e.xlarge'
      use_spot:
        description: 'Spot instance を使用する（安価だが中断リスクあり）'
        type: boolean
        default: false

jobs:
  quantize-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5h — GHAハードリミット6hの前にクリーンアップを確実に動かす
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve AWS account ID
        id: account
        run: |
          case "${{ inputs.environment }}" in
            prod) echo "id=${{ vars.PROD_AWS_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
            test) echo "id=${{ vars.TEST_AWS_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/${{ vars.WORKLOAD_NAME }}-${{ inputs.environment }}-quantize-gha-role
          aws-region: ${{ vars.AWS_REGION }}

      # ── 1. 環境依存リソースを AWS CLI で取得 ──────────────────────────────
      - name: Resolve environment resources
        id: resolve
        env:
          ENV: ${{ inputs.environment }}
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?contains(Name, '${ENV}-ml-data') && !contains(Name, '-log')].Name | [0]" \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "ML_DATA_BUCKET: $BUCKET"

          PROFILE=$(aws iam list-instance-profiles \
            --query "InstanceProfiles[?contains(InstanceProfileName, '${ENV}-quantize-instance-profile')].InstanceProfileName | [0]" \
            --output text)
          echo "instance_profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "Instance profile: $PROFILE"

      # ── 2. Deep Learning AMI を動的に取得 ────────────────────────────────
      - name: Find latest Deep Learning AMI
        id: find-ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=Deep Learning OSS Nvidia Driver AMI GPU PyTorch*Ubuntu*" \
              "Name=architecture,Values=x86_64" \
              "Name=state,Values=available" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text)
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"
          echo "Using AMI: $AMI_ID"

      # ── 3. 一時セキュリティグループ作成（インバウンド不要・SSMのみ）────────
      - name: Create security group
        id: create-sg
        run: |
          SG_ID=$(aws ec2 create-security-group \
            --group-name "quantize-${{ github.run_id }}" \
            --description "Temp SG for quantize run ${{ github.run_id }}" \
            --query GroupId --output text)
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"
          echo "Created SG: $SG_ID"

      # ── 4. EC2 起動 ──────────────────────────────────────────────────────
      - name: Launch EC2 instance
        id: launch-ec2
        run: |
          MARKET_OPTIONS=''
          if [ '${{ inputs.use_spot }}' = 'true' ]; then
            MARKET_OPTIONS='--instance-market-options MarketType=spot'
          fi

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ steps.find-ami.outputs.ami_id }} \
            --instance-type ${{ inputs.instance_type }} \
            --iam-instance-profile Name=${{ steps.resolve.outputs.instance_profile }} \
            --security-group-ids ${{ steps.create-sg.outputs.sg_id }} \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":150,"VolumeType":"gp3"}}]' \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=quantize-${{ github.run_id }}},{Key=GithubRunId,Value=${{ github.run_id }}}]" \
            $MARKET_OPTIONS \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Launched: $INSTANCE_ID"

      - name: Wait for instance running
        run: |
          aws ec2 wait instance-running \
            --instance-ids ${{ steps.launch-ec2.outputs.instance_id }}

      # ── 5. SSM エージェントの起動を待つ ──────────────────────────────────
      - name: Wait for SSM agent
        run: |
          INSTANCE_ID=${{ steps.launch-ec2.outputs.instance_id }}
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            echo "SSM status: $STATUS ($i/30)"
            if [ "$STATUS" = "Online" ]; then
              echo "SSM ready"
              exit 0
            fi
            sleep 20
          done
          echo "Timeout waiting for SSM"
          exit 1

      # ── 6. スクリプトを S3 経由でインスタンスに渡す ──────────────────────
      - name: Upload quantize script to S3
        run: |
          aws s3 cp scripts/hf_to_s3.py \
            s3://${{ steps.resolve.outputs.bucket }}/tmp/quantize-${{ github.run_id }}/hf_to_s3.py

      # ── 7. 量子化 & S3 アップロード（SSM経由）───────────────────────────
      - name: Run quantization via SSM
        id: run-quantize
        run: |
          BUCKET=${{ steps.resolve.outputs.bucket }}
          SCRIPT=$(cat <<'ENDSCRIPT'
          #!/bin/bash
          set -e
          # PyTorch 2.6+ は venv、旧版は conda — 両方に対応
          if [ -f /opt/pytorch/bin/activate ]; then
            source /opt/pytorch/bin/activate
          elif [ -f /opt/conda/etc/profile.d/conda.sh ]; then
            source /opt/conda/etc/profile.d/conda.sh
            ENV=$(conda env list | grep -E '^pytorch' | awk 'NR==1{print $1}')
            conda activate "${ENV:-base}"
          fi

          # GPU ドライバー確認（失敗時は即終了してログに原因を残す）
          nvidia-smi || { echo "ERROR: nvidia-smi failed — GPU driver not ready"; exit 1; }

          # DL AMI 付属の torch を再ダウンロードさせないようバージョンを固定
          TORCH_VER=$(python -c "import torch; print(torch.__version__)")
          echo "Pinning torch==$TORCH_VER"
          pip install "torch==$TORCH_VER" "numpy>=2.1.0" llmcompressor datasets bitsandbytes transformers accelerate huggingface-hub tqdm boto3 -q

          aws s3 cp s3://BUCKET_NAME/tmp/quantize-GITHUB_RUN_ID/hf_to_s3.py /tmp/hf_to_s3.py

          export HF_TOKEN=HF_TOKEN_VALUE
          export HF_MODEL_ID=HF_MODEL_ID_VALUE
          export ML_DATA_BUCKET=BUCKET_NAME
          export QUANTIZE=QUANTIZE_VALUE

          python /tmp/hf_to_s3.py
          ENDSCRIPT
          )

          SCRIPT="${SCRIPT//BUCKET_NAME/$BUCKET}"
          SCRIPT="${SCRIPT//GITHUB_RUN_ID/${{ github.run_id }}}"
          SCRIPT="${SCRIPT//HF_TOKEN_VALUE/${{ secrets.HF_TOKEN }}}"
          SCRIPT="${SCRIPT//HF_MODEL_ID_VALUE/${{ inputs.hf_model_id }}}"
          SCRIPT="${SCRIPT//QUANTIZE_VALUE/${{ inputs.quantize }}}"

          # jq で改行をエスケープして有効な JSON を生成
          PARAMS=$(jq -cn --arg cmd "$SCRIPT" '{"commands":[$cmd],"executionTimeout":["18000"]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.launch-ec2.outputs.instance_id }} \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --timeout-seconds 18000 \
            --output-s3-bucket-name "$BUCKET" \
            --output-s3-key-prefix "logs/ssm/${{ github.run_id }}" \
            --comment "Quantize ${{ inputs.hf_model_id }} as ${{ inputs.quantize }}" \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

      # ── 8. 完了まで待機（最大5時間）─────────────────────────────────────
      - name: Wait for quantization to complete
        run: |
          COMMAND_ID=${{ steps.run-quantize.outputs.command_id }}
          INSTANCE_ID=${{ steps.launch-ec2.outputs.instance_id }}
          BUCKET=${{ steps.resolve.outputs.bucket }}
          LOG_PREFIX="logs/ssm/${{ github.run_id }}/${COMMAND_ID}/${INSTANCE_ID}/awsrunShellScript/0.awsrunShellScript"

          for i in $(seq 1 150); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i/150] $STATUS"

            case "$STATUS" in
              Success)
                echo "=== 完了 ==="
                aws s3 cp "s3://${BUCKET}/${LOG_PREFIX}/stdout" - 2>/dev/null || \
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardOutputContent" --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "=== 失敗: $STATUS ==="
                echo "--- stdout ---"
                aws s3 cp "s3://${BUCKET}/${LOG_PREFIX}/stdout" - 2>/dev/null || true
                echo "--- stderr ---"
                aws s3 cp "s3://${BUCKET}/${LOG_PREFIX}/stderr" - 2>/dev/null || \
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardErrorContent" --output text
                exit 1
                ;;
            esac
            sleep 120
          done
          echo "Timeout"
          exit 1

      # ── 9. クリーンアップ（失敗時も必ず実行）────────────────────────────
      - name: Cleanup - terminate EC2
        if: always()
        run: |
          INSTANCE_ID=${{ steps.launch-ec2.outputs.instance_id }}
          if [ -n "$INSTANCE_ID" ]; then
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" || true
            aws ec2 wait instance-terminated --instance-ids "$INSTANCE_ID" || true
            echo "Terminated: $INSTANCE_ID"
          fi

      - name: Cleanup - delete security group
        if: always()
        run: |
          SG_ID=${{ steps.create-sg.outputs.sg_id }}
          if [ -n "$SG_ID" ]; then
            sleep 15
            aws ec2 delete-security-group --group-id "$SG_ID" || true
            echo "Deleted SG: $SG_ID"
          fi

      - name: Cleanup - delete temp script from S3
        if: always()
        run: |
          BUCKET=${{ steps.resolve.outputs.bucket }}
          if [ -n "$BUCKET" ]; then
            aws s3 rm s3://${BUCKET}/tmp/quantize-${{ github.run_id }}/ --recursive || true
          fi
