name: eks-orphan-cleanup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [test, prod]
      cluster_name:
        description: "EKS cluster name (leave blank to auto-detect from Terraform state)"
        required: false
        type: string

env:
  TF_WORKING_DIR: "infra/terraform"

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve account ID
        id: account
        run: |
          case "${{ github.event.inputs.environment }}" in
            prod) echo "id=${{ vars.PROD_AWS_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
            test) echo "id=${{ vars.TEST_AWS_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/GitHubActionsWorkloadDeployRole
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3

      - name: Resolve cluster name
        id: cluster
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          CLUSTER_NAME="${{ github.event.inputs.cluster_name }}"
          if [ -z "$CLUSTER_NAME" ]; then
            terraform init -backend-config=backend.hcl \
              -backend-config="key=workloads/${{ vars.WORKLOAD_NAME }}/${{ github.event.inputs.environment }}/additional_github_repos/${{ github.repository }}/terraform.tfstate" \
              -reconfigure 2>/dev/null
            CLUSTER_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")
          fi
          if [ -z "$CLUSTER_NAME" ]; then
            echo "::error::Could not determine cluster name. Pass it explicitly via the cluster_name input."
            exit 1
          fi
          echo "name=$CLUSTER_NAME" >> "$GITHUB_OUTPUT"
          echo "Cluster: $CLUSTER_NAME"

      - name: Audit orphaned AWS resources
        env:
          CLUSTER_NAME: ${{ steps.cluster.outputs.name }}
        run: |
          REGION="ap-northeast-1"
          FOUND=false

          echo ""
          echo "############################################################"
          echo "  EKS Orphan Audit — cluster: ${CLUSTER_NAME}"
          echo "############################################################"
          echo ""

          # ----------------------------------------------------------------
          echo "=== [1] EBS Volumes (EBS CSI) ==="
          IDS=$(aws ec2 describe-volumes \
            --region "$REGION" \
            --filters "Name=tag:kubernetes.io/cluster/${CLUSTER_NAME},Values=owned" \
            --query "Volumes[*].VolumeId" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          if [ -n "$IDS" ]; then
            FOUND=true
            echo "$IDS"
            echo "--- delete commands ---"
            echo "$IDS" | while read -r id; do
              echo "aws ec2 delete-volume --volume-id $id --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [2] EC2 Instances (Karpenter nodes) ==="
          IDS=$(aws ec2 describe-instances \
            --region "$REGION" \
            --filters \
              "Name=tag:karpenter.sh/cluster-name,Values=${CLUSTER_NAME}" \
              "Name=instance-state-name,Values=running,pending,stopping,stopped" \
            --query "Reservations[*].Instances[*].InstanceId" --output text 2>/dev/null | tr '\t' ' ' | xargs || true)
          if [ -n "$IDS" ]; then
            FOUND=true
            echo "$IDS" | tr ' ' '\n'
            echo "--- delete commands ---"
            echo "aws ec2 terminate-instances --instance-ids $IDS --region $REGION"
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [3] ALB / NLB (AWS Load Balancer Controller) ==="
          ALL_LB_ARNS=$(aws elbv2 describe-load-balancers \
            --region "$REGION" \
            --query "LoadBalancers[*].LoadBalancerArn" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          LB_ARNS=""
          for ARN in $ALL_LB_ARNS; do
            TAGS=$(aws elbv2 describe-tags --region "$REGION" --resource-arns "$ARN" \
              --query "TagDescriptions[0].Tags" --output json 2>/dev/null || echo "[]")
            if echo "$TAGS" | grep -q "kubernetes.io/cluster/${CLUSTER_NAME}"; then
              LB_ARNS="${LB_ARNS} ${ARN}"
            fi
          done
          if [ -n "$LB_ARNS" ]; then
            FOUND=true
            echo "$LB_ARNS" | tr ' ' '\n' | grep -v '^$'
            echo "--- delete commands ---"
            echo "$LB_ARNS" | tr ' ' '\n' | grep -v '^$' | while read -r arn; do
              echo "aws elbv2 delete-load-balancer --load-balancer-arn $arn --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [4] Classic ELBs (type:LoadBalancer v1) ==="
          CLASSIC_NAMES=$(aws elb describe-load-balancers \
            --region "$REGION" \
            --query "LoadBalancerDescriptions[*].LoadBalancerName" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          CLASSIC_ORPHANS=""
          for NAME in $CLASSIC_NAMES; do
            TAGS=$(aws elb describe-tags --region "$REGION" --load-balancer-names "$NAME" \
              --query "TagDescriptions[0].Tags" --output json 2>/dev/null || echo "[]")
            if echo "$TAGS" | grep -q "kubernetes.io/cluster/${CLUSTER_NAME}"; then
              CLASSIC_ORPHANS="${CLASSIC_ORPHANS} ${NAME}"
            fi
          done
          if [ -n "$CLASSIC_ORPHANS" ]; then
            FOUND=true
            echo "$CLASSIC_ORPHANS" | tr ' ' '\n' | grep -v '^$'
            echo "--- delete commands ---"
            echo "$CLASSIC_ORPHANS" | tr ' ' '\n' | grep -v '^$' | while read -r name; do
              echo "aws elb delete-load-balancer --load-balancer-name $name --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [5] Target Groups (AWS LBC) ==="
          IDS=$(aws elbv2 describe-target-groups \
            --region "$REGION" \
            --query "TargetGroups[?contains(TargetGroupName, '${CLUSTER_NAME}') == \`true\`].TargetGroupArn" \
            --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          if [ -n "$IDS" ]; then
            FOUND=true
            echo "$IDS"
            echo "--- delete commands ---"
            echo "$IDS" | while read -r arn; do
              echo "aws elbv2 delete-target-group --target-group-arn $arn --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [6] Security Groups — AWS LBC (elbv2.k8s.aws/cluster) ==="
          IDS=$(aws ec2 describe-security-groups \
            --region "$REGION" \
            --filters "Name=tag:elbv2.k8s.aws/cluster,Values=${CLUSTER_NAME}" \
            --query "SecurityGroups[*].GroupId" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          if [ -n "$IDS" ]; then
            FOUND=true
            echo "$IDS"
            echo "--- delete commands ---"
            echo "$IDS" | while read -r id; do
              echo "aws ec2 delete-security-group --group-id $id --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [7] Security Groups — Karpenter (karpenter.sh/discovery) ==="
          IDS=$(aws ec2 describe-security-groups \
            --region "$REGION" \
            --filters "Name=tag:karpenter.sh/discovery,Values=${CLUSTER_NAME}" \
            --query "SecurityGroups[*].GroupId" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          if [ -n "$IDS" ]; then
            FOUND=true
            echo "$IDS"
            echo "--- delete commands ---"
            echo "$IDS" | while read -r id; do
              echo "aws ec2 delete-security-group --group-id $id --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [8] ENIs (VPC CNI) ==="
          IDS=$(aws ec2 describe-network-interfaces \
            --region "$REGION" \
            --filters "Name=tag:kubernetes.io/cluster/${CLUSTER_NAME},Values=owned" \
            --query "NetworkInterfaces[*].NetworkInterfaceId" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          if [ -n "$IDS" ]; then
            FOUND=true
            echo "$IDS"
            echo "--- delete commands ---"
            echo "$IDS" | while read -r id; do
              echo "aws ec2 delete-network-interface --network-interface-id $id --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "=== [9] CloudWatch Log Groups ==="
          LOG_GROUPS=$(aws logs describe-log-groups \
            --region "$REGION" \
            --log-group-name-prefix "/aws/eks/${CLUSTER_NAME}" \
            --query "logGroups[*].logGroupName" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          CW_EXTRA=$(aws logs describe-log-groups \
            --region "$REGION" \
            --log-group-name-prefix "/aws/containerinsights/${CLUSTER_NAME}" \
            --query "logGroups[*].logGroupName" --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
          ALL_LGS=$(printf "%s\n%s" "$LOG_GROUPS" "$CW_EXTRA" | grep -v '^$' || true)
          if [ -n "$ALL_LGS" ]; then
            FOUND=true
            echo "$ALL_LGS"
            echo "--- delete commands ---"
            echo "$ALL_LGS" | while read -r lg; do
              echo "aws logs delete-log-group --log-group-name \"$lg\" --region $REGION"
            done
          else
            echo "(none)"
          fi
          echo ""

          # ----------------------------------------------------------------
          echo "############################################################"
          if [ "$FOUND" = "true" ]; then
            echo "  RESULT: Orphaned resources found. Run the delete commands above."
          else
            echo "  RESULT: No orphaned resources found. All clear."
          fi
          echo "############################################################"
